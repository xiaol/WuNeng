[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnn-state-tuning"
version = "0.1.0"
description = "Parameter-efficient initial-state tuning for recurrent language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.10",
    "huggingface-hub>=0.36",
    "safetensors>=0.5",
    "torch>=2.6",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rnn-state-train = "rnn_state_tuning.cli.train:main"
rnn-state-generate = "rnn_state_tuning.cli.generate:main"
rnn-state-dataset = "rnn_state_tuning.cli.dataset:main"
rnn-state-benchmark = "rnn_state_tuning.cli.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
